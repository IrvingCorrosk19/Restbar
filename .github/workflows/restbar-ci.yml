name: RestBar CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore RestBar/RestBar.csproj
      - name: Build
        run: dotnet build RestBar/RestBar.csproj -c Release --no-restore
      - name: Unit tests
        run: dotnet test RestBar.Tests/RestBar.Tests.csproj -c Release --verbosity minimal
