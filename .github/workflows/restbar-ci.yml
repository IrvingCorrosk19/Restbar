name: RestBar Quality Gates

# RB-027 — Permanent quality gate. A PR must not merge if required jobs fail.
# Browser smoke against a live URL is required when RESTBAR_BASE_URL is configured
# (org secret). Deploy scripts must not run if CI is red.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: restbar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: Compila ─────────────────────────────────────────────────────────
  gate1-build:
    name: "G1 Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore RestBar/RestBar.csproj
      - name: Build Release
        run: dotnet build RestBar/RestBar.csproj -c Release --no-restore -warnaserror:false

  # ── Gate 2: Unitarias ───────────────────────────────────────────────────────
  gate2-unit:
    name: "G2 Unit tests"
    needs: gate1-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests + coverage
        run: >
          dotnet test RestBar.Tests/RestBar.Tests.csproj
          -c Release
          --verbosity minimal
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  # ── Gate 3 / 8: Paquetes vulnerables + política de repo ─────────────────────
  gate3-security-static:
    name: "G3/G8 Security + static policy"
    needs: gate1-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore for audit
        run: dotnet restore RestBar/RestBar.csproj
      - name: Vulnerable package audit (fail on High/Critical)
        run: |
          set -e
          dotnet list RestBar/RestBar.csproj package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -qiE 'Critical|High' vuln-report.txt; then
            echo "::error::High/Critical vulnerable packages detected"
            cat vuln-report.txt
            exit 1
          fi
          echo "No High/Critical advisories (Moderate may remain — tracked in RB-027)"
      - name: Upload vuln report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vuln-report
          path: vuln-report.txt
          if-no-files-found: ignore
      - name: Required quality assets present
        run: |
          set -e
          test -f RestBar/RB-027_QUALITY_GATE/01_Quality_Gates.md
          test -f RestBar/RB-027_QUALITY_GATE/08_Development_Standards.md
          test -f RestBar/RB-027_QUALITY_GATE/09_Contribution_Guide.md
          test -f RestBar/Com/quality/run-quality-gates.ps1
          test -f RestBar/tests/Browser/playwright.config.js
          test -f RestBar.Tests/RestBar.Tests.csproj
          echo "Policy assets OK"

  # ── Gate 4/5/6/7: Browser smoke (when staging URL configured) ───────────────
  gate4-browser-smoke:
    name: "G4 Browser smoke"
    needs: [gate2-unit, gate3-security-static]
    runs-on: ubuntu-latest
    # Set repository variable RESTBAR_BASE_URL (e.g. staging VPS) to enforce this job.
    if: ${{ vars.RESTBAR_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: RestBar/tests/Browser/package-lock.json
      - name: Install Playwright
        working-directory: RestBar/tests/Browser
        run: |
          npm ci || npm install
          npx playwright install chromium --with-deps
      - name: Smoke + Security + MT + Perf (chromium-desktop)
        working-directory: RestBar/tests/Browser
        env:
          RESTBAR_BASE_URL: ${{ vars.RESTBAR_BASE_URL }}
          RESTBAR_ADMIN_EMAIL: ${{ secrets.RESTBAR_ADMIN_EMAIL }}
          RESTBAR_ADMIN_PASSWORD: ${{ secrets.RESTBAR_ADMIN_PASSWORD }}
        run: >
          npx playwright test
          Smoke Security Multitenant Performance
          --project=chromium-desktop
          --reporter=list
          --retries=1

  # ── Aggregate gate (required check name for branch protection) ─────────────
  quality-gate:
    name: "Quality Gate"
    needs: [gate1-build, gate2-unit, gate3-security-static]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Enforce required gates
        run: |
          echo "G1=${{ needs.gate1-build.result }}"
          echo "G2=${{ needs.gate2-unit.result }}"
          echo "G3=${{ needs.gate3-security-static.result }}"
          test "${{ needs.gate1-build.result }}" = "success"
          test "${{ needs.gate2-unit.result }}" = "success"
          test "${{ needs.gate3-security-static.result }}" = "success"
          echo "Required Quality Gates PASSED"
          echo "::notice::Browser smoke (G4) is mandatory when RESTBAR_BASE_URL is set as repo variable/secret. Configure branch protection on job 'Quality Gate'."
